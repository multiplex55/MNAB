name: CI and Windows release

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - if: runner.os == 'Windows'
        run: cargo build --release --target x86_64-pc-windows-msvc
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem MNAB-v*-windows-x64.zip | Select-Object -First 1
          $names = tar -tf $zip.FullName
          if (($names -join ',') -ne 'mnab.exe,README.txt') { throw "Unexpected ZIP contents: $names" }
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: MNAB-windows-x64
          path: MNAB-v*-windows-x64.zip
