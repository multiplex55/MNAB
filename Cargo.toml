[package]
name = "mnab"
version = "0.1.0"
edition = "2024"
description = "Multi Needs A Budget"
license = "MIT"

[dependencies]
csv = "1.3"
eframe = "0.32"
egui = "0.32"
egui_extras = "0.32"
quick-xml = { version = "0.38", features = ["serialize"] }
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

